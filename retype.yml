# JVtools documentation site — Retype (Pro)
# Docs: https://retype.com/configuration/project/

input: .
output: .retype

# Keep the CLAUDE.md hub and the version manifests in the repo but out of the
# built docs site. (versions/*.json is read by the HDAs' update check via the
# GitHub raw URL, not served as a doc page.)
# 🔴 store-covers/ holds GUMROAD cover + thumbnail art. It is excluded on
# purpose: JVTOOLS_MARKETING_IMAGERY.md forbids publishing store covers onto
# the docs site, but the Gumroad API can only FETCH a public URL — so the art
# lives in this public repo, out of the build, and is served by
# raw.githubusercontent.com. Exactly the versions/*.json trick.
exclude:
  - "CLAUDE.md"
  - "versions"
  - "store-covers"

# The public base URL of the site. Must EXACTLY match the domain the Retype
# Pro license key is registered to (here: jvtools.dev). If you later move
# again, update this AND re-license the key to that domain. A mismatch does
# not fail the build - it silently drops every Pro feature.
#
# The build is published to the `retype` branch exactly as before, so
# tonehammer.github.io/jvtools-docs/ keeps serving it. That is deliberate and
# must stay that way: every shipped HDA bakes the github.io URL into its Docs
# button and will keep going there until that product's next release.
# It works because Retype writes page links AND assets document-relative, so
# one build serves correctly under either prefix; only the canonical, og:url
# and sitemap take this value - which is exactly what should point at the new
# home while the old host keeps working.
url: https://jvtools.dev/docs/

# Browser-tab icon. Retype's `favicon` key is TOP-LEVEL (not under `branding`)
# and takes a .ico or .png only, path relative to the input directory - so an
# SVG that adapts to prefers-color-scheme is not available through it, and the
# single file has to work on a light tab AND a dark one.
#
# The GREEN mark (#1da54f, static/jvtools-icon-green.svg) plus a white page-with-
# a-folded-corner badge, so the tab says "jvtools" and "documentation" at once.
# ⚠ The ink mark (#26211b) was tried first and rejected on measurement: it is a
# filled disc, so on a dark tab it melts into the ground and all but disappears.
# Green reads on both.
# 🔑 The badge is a PAGE rather than a book or lines of text because the only
# size that matters is 16px, and at 16px internal detail is mush - candidates
# were rendered at 16/32/48 on both tab grounds before choosing. A page keeps a
# distinct silhouette (a white square with one clipped corner) when an open book
# has already collapsed into a smudge. Source: tools/favicon_docs.py in the
# session scratchpad; regenerate from jvtools-icon-green.svg if the mark changes.
favicon: static/favicon.png

branding:
  title: JVtools
  label: Docs

# Top navigation (header links). Products live in a DROPDOWN, not as flat entries.
# 🔴 A flat entry per product does not scale, and the ceiling is lower than it looks:
# measured on the live DOM, five flat items need ~1350px of header. Below that the
# container overflows the viewport and clips the theme and history buttons off the
# right edge - 85px over at 1280, and a 1366 laptop sits right on the line. Retype
# supports nested `items:` one level deep, so the whole family fits in one menu and a
# new product is a line in it rather than a width problem.
# ⚠ Keep the members in the same order as the sidebar.
links:
  - text: Home
    link: /
    icon: home
  - text: Products
    icon: package
    items:
      - text: Reallusion Importer
        link: /reallusion-importer/
        icon: person
      - text: Advanced Velocity
        link: /advanced-velocity/
        icon: zap
      - text: RPLidar In
        link: /rplidar-in/
        icon: broadcast
      - text: COPout
        link: /copout/
        icon: device-desktop
      - text: Deoverlap Polylines
        link: /deoverlap-polylines/
        icon: git-branch

# Git-backed freshness stamp at the foot of every page. Needs full git history
# at build time - the deploy workflow already checks out with fetch-depth: 0,
# without which Retype silently skips the values rather than erroring.
lastUpdated:
  date:
    enabled: true
    source: committer

# Single source of truth for the product versions shown in the docs prose.
# Reference as {{ av.version }} etc. so a release bumps ONE line here instead
# of each product page separately.
# 🔴 These are the DOCS versions (the changelog is their source of truth).
# These always carry the FULL version, patch digit included (Jovan, 2026-08-26:
# everything a human reads shows 1.2.3, never 1.2). versions/<slug>.json is a
# SEPARATE signal: its `latest` is the update check's NOTIFY gate and deliberately
# holds at the minor through a patch, so it will read 1.2 while this says 1.2.3.
# That is by design - do not sync them blindly.
data:
  av:
    name: Advanced Velocity
    version: "1.1"
  rl:
    name: Reallusion Importer for Houdini
    version: "1.2.4"
  rp:
    name: RPLidar In
    version: "1.0"
  co:
    name: COPout
    version: "1.0"
  dp:
    name: Deoverlap Polylines
    version: "1.0"
# 🔴 A PRE-RELEASE PRODUCT GETS NO ENTRY HERE, AND NO FOLDER IN THIS REPO.
# This repo is PUBLIC (Pages + the raw manifest URL both require it), so a
# `visibility: hidden` section still leaks the product's name, pitch and roadmap
# to anyone browsing github.com. Unreleased sections live in the PRIVATE
# jvtools-internal/docs-staging/ and are copied in on the day the Gumroad
# listing goes live. That folder's README carries the publish checklist.

# Analytics. Uncomment ONE and fill in the id - see the setup notes in
# CLAUDE.md. Plausible is the privacy-preserving option and needs no cookie
# banner; Google Analytics is free and needs one in the EU.
# integrations:
#   googleAnalytics:
#     id: G-XXXXXXXXXX
#   plausible:
#     domain: tonehammer.github.io

# Pro: remove the "Made with Retype" footer (requires the RETYPE_KEY secret
# to be present at build time, else the build fails on this Pro-only option).
poweredByRetype: false
