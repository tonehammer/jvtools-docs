# Build the Retype site and publish it to GitHub Pages on every push to main.
# Retype's official actions: https://retype.com/guides/github-actions/
#
# One-time GitHub setup (after this repo is pushed to GitHub):
#   1. Settings -> Pages -> Build and deployment -> Source: "Deploy from a
#      branch", Branch: "retype" / root. (action-github-pages creates that
#      branch on first run.)
#   2. Settings -> Actions -> General -> Workflow permissions:
#      "Read and write permissions".
name: Publish Retype site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: retypeapp/action-build@latest
        id: build
        env:
          RETYPE_KEY: ${{ secrets.RETYPE_KEY }}

      # 🔴 KEEP THE CNAME OUT OF THE PUBLISHED BRANCH. Retype writes a CNAME
      # file from the HOST in retype.yml's `url:`. With url on jvtools.dev that
      # made GitHub adopt jvtools.dev as THIS repo's Pages custom domain, and
      # Pages then 301'd tonehammer.github.io/jvtools-docs/* to jvtools.dev/*
      # with the /docs prefix DROPPED - so every one of those 404'd, including
      # the Docs button baked into every shipped HDA. Measured 2026-08-28.
      #
      # We deliberately want the opposite: jvtools.dev/docs is served by the
      # Cloudflare Pages website, while github.io keeps serving this same build
      # directly, forever, for HDAs that still point at it. Only the canonical
      # and og:url should carry the new home - and those come from `url:`, not
      # from this file.
      - name: Drop the CNAME so github.io keeps serving instead of redirecting
        shell: bash
        run: |
          rm -f "${{ steps.build.outputs.retype-output-path }}/CNAME"
          test ! -e "${{ steps.build.outputs.retype-output-path }}/CNAME"

      - uses: retypeapp/action-github-pages@latest
        with:
          update-branch: true
